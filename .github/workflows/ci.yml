name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Runtime governance
        run: npm run test:runtime-governance

      - name: Golden replay
        run: npm run test:golden-replay

      - name: Stage 1 regression
        run: npm run test:stage1

      - name: Chain regression
        run: npm run test:chain
